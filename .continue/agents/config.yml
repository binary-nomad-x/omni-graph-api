name: Ultimate 9B Speed Optimized Config
version: 2.2.0
schema: v1

models:
  # 1. Primary High-Performance Model (Chat, Edit, & Apply)
  - name: Qwen 3.5 9B
    provider: ollama
    model: qwen3.5:9b
    roles:
      - chat
      - edit
      - apply

  # 2. Secondary Fast Coding Model
  - name: Qwen 2.5 Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    roles:
      - chat

  # 3. Fast Multipurpose Model
  - name: LFM 2.5 8B
    provider: ollama
    model: lfm2.5:8b
    roles:
      - chat

  # Auto-discovery for new models
  - name: Autodetect
    provider: ollama
    model: AUTODETECT

# Speed Improve Karne ke Liye: Autocomplete par chota aur fast model set kiya hai
tabAutocompleteModel:
  title: Qwen 3.5 4B (Fast)
  provider: ollama
  model: qwen3.5:4b-q4_K_M