  updatedAt: DateTime!
}

input UpdateUserInput {
  name: String
  email: String
  password: String
}

fragment UserBasic on User {
  id
  email
  name
  age
  role
}

fragment UserFull on User {
  ...UserBasic
  profile {
    ...ProfileBasic
  }
  posts {
    id
    title
    published
  }
  createdAt
  updatedAt
}

fragment ProfileBasic on Profile {
  id
  bio
  avatar
  phone
}

